name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_docker:
        description: 'Skip Docker build and push'
        type: boolean
        default: false
      skip_nuget:
        description: 'Skip NuGet packaging'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Build and run unit tests (exclude E2E)
        id: build
        uses: ./.github/actions/dotnet-build-and-test
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          solution-file: 'All.sln'
          build-configuration: 'Release'
          # IntegrationTests need a live SQL Server, which this job does not start. They run in
          # integration-tests-sql, which does. Their fixtures fail rather than skip when the connection
          # string is absent, so running them here is 222 red tests that say nothing about the code.
          test-filter: 'FullyQualifiedName!~E2ETests&FullyQualifiedName!~IntegrationTests'

      - name: Store version for later jobs
        run: |
          echo "VERSION=${{ steps.build.outputs.version }}" >> $GITHUB_ENV
          echo "ASSEMBLY_VERSION=${{ steps.build.outputs.assembly-version }}" >> $GITHUB_ENV
          echo "NUGET_VERSION=${{ steps.build.outputs.nuget-version }}" >> $GITHUB_ENV

      - name: Create package output directories
        if: "${{ !inputs.skip_nuget }}"
        run: |
          mkdir -p ./core-packages
          mkdir -p ./internal-packages

      # ADR 2606: auto-discovery via IsPackable; per-package pre-release suffix computed in
      # Directory.Build.targets from PackageStability. UpdateVersionProperties=false stops
      # GitVersion.MsBuild overwriting the computed PackageVersion at pack time.
      - name: Pack Core projects (public - NuGet.org)
        if: "${{ !inputs.skip_nuget }}"
        run: |
          find src/Core tools src/Application/Ignixa.Sidecar.Contracts -name "*.csproj" -type f | sort | while read -r PROJECT; do
            echo "Packing: $PROJECT"
            dotnet pack "$PROJECT" --configuration Release --no-build --output ./core-packages \
              -p:BasePackageVersion=${{ steps.build.outputs.nuget-version }} \
              -p:UpdateVersionProperties=false
          done

      - name: Pack Application projects (internal - GitHub Packages)
        if: "${{ !inputs.skip_nuget }}"
        run: |
          # Sidecar.Contracts is packed in core-packages for public NuGet.org distribution.
          # Internal Application/DataLayer packages publish stable (see src/Application and
          # src/DataLayer Directory.Build.props) and may carry prerelease dependencies (e.g. the
          # preview ModelContextProtocol SDK, or beta Core packages via project references).
          # NU5104 stays an error for the public Core feed but is demoted to a warning here, since
          # the internal GitHub Packages feed is not bound by the public stability-purity rule.
          find src/Application src/DataLayer -name "*.csproj" -type f -not -path "*Ignixa.Sidecar.Contracts*" | sort | while read -r PROJECT; do
            echo "Packing: $PROJECT"
            dotnet pack "$PROJECT" --configuration Release --no-build --output ./internal-packages \
              -p:BasePackageVersion=${{ steps.build.outputs.nuget-version }} \
              -p:UpdateVersionProperties=false \
              -p:WarningsNotAsErrors=NU5104
          done

      - name: List Core packages
        if: "${{ !inputs.skip_nuget }}"
        run: |
          echo "Core packages (public - NuGet.org):"
          ls -lh ./core-packages/

      - name: List Internal packages
        if: "${{ !inputs.skip_nuget }}"
        run: |
          echo "Internal packages (GitHub Packages):"
          ls -lh ./internal-packages/

      - name: Save version and commit SHA for release
        if: "${{ !inputs.skip_nuget }}"
        run: |
          echo "${{ steps.build.outputs.version }}" > ./core-packages/version.txt
          echo "${{ github.sha }}" > ./core-packages/commit-sha.txt
          cp ./core-packages/version.txt ./internal-packages/version.txt
          cp ./core-packages/commit-sha.txt ./internal-packages/commit-sha.txt
          echo "Version: $(cat ./core-packages/version.txt)"
          echo "Commit SHA: $(cat ./core-packages/commit-sha.txt)"

      - name: Upload Core packages as artifacts
        if: "${{ !inputs.skip_nuget }}"
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-core
          path: |
            ./core-packages/*.nupkg
            ./core-packages/version.txt
            ./core-packages/commit-sha.txt
          retention-days: 30

      - name: Upload Internal packages as artifacts
        if: "${{ !inputs.skip_nuget }}"
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-internal
          path: |
            ./internal-packages/*.nupkg
            ./internal-packages/version.txt
            ./internal-packages/commit-sha.txt
          retention-days: 30

      - name: Package summary
        if: "${{ !inputs.skip_nuget }}"
        run: |
          echo "## 📦 NuGet Packages Ready for Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Packages (Public - NuGet.org)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./core-packages/*.nupkg; do
            basename "$pkg" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Internal Packages (GitHub Packages)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./internal-packages/*.nupkg; do
            basename "$pkg" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use the **Publish Release** workflow to publish and create a GitHub release." >> $GITHUB_STEP_SUMMARY

  # Its own job, not a step in e2e-tests-sql. Two reasons: the suite serialises its schema deploys
  # (sixteen concurrent DacFx deploys time each other out) so it runs long, and as a step it made the
  # E2E tests conditional on it -- one integration failure skipped the E2E run entirely.
  integration-tests-sql:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    # Job-scoped for the same reason as e2e-tests-sql below.
    env:
      SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server container
        run: |
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "Container startup failed. Checking logs..."
            docker compose -f docker-compose.test.yml logs
            docker ps -a
            exit 1
          }
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Verify SQL Server connection
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "SELECT @@VERSION" -b
        timeout-minutes: 2

      - name: Run SQL Server integration tests
        run: |
          dotnet test test/Ignixa.DataLayer.SqlServer.IntegrationTests/Ignixa.DataLayer.SqlServer.IntegrationTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=integration-test-results.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=master;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"
          SqlServer__AutomaticSchemaDeploymentEnabled: "true"
          Logging__LogLevel__Default: "Warning"
          Logging__LogLevel__Microsoft: "Warning"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration-test-results.trx'

      - name: Cleanup SQL Server container
        if: always()
        run: docker compose -f docker-compose.test.yml down -v || true

  e2e-tests-sql:
    name: E2E Tests (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    # Run in parallel with unit tests for faster CI (both do their own build)
    # SQL_SA_PASSWORD is job-scoped (not workflow-level) so it isn't exposed to
    # sql-on-fhir-conformance's `npm install` against an uncontrolled vendored submodule.
    env:
      SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server container
        run: |
          echo "Starting SQL Server and Azurite containers..."
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "❌ Container startup failed. Checking logs..."
            docker compose -f docker-compose.test.yml logs
            docker ps -a
            exit 1
          }
          echo "✅ SQL Server and Azurite started and healthy"
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Verify SQL Server connection
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "SELECT @@VERSION" -b
        timeout-minutes: 2

      # These carry the safety-critical assertions DeployReportClassifier/SchemaDeployer/the
      # schema-upgrade CLI exist for (e.g. a genuinely destructive diff is refused, --allow-data-loss
      # is load-bearing) -- previously [Fact(Skip = ...)]-marked and never run anywhere. They're
      # [SkippableFact] now: each skips itself (not fails) when TEST_SQL_CONNECTION_STRING is unset,
      # so the same test classes remain harmless no-ops in the SQL-Server-less unit-test job while
      # actually running here, against the container already started above.
      - name: Run SqlServer schema deploy/upgrade integration tests
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "CREATE DATABASE [IgnixaSchemaUpgradeTests]" -b
          dotnet test test/Ignixa.DataLayer.SqlServer.IntegrationTests/Ignixa.DataLayer.SqlServer.IntegrationTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=schema-deployer-integration-tests.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
          dotnet test test/Ignixa.SchemaUpgrade.Cli.Tests/Ignixa.SchemaUpgrade.Cli.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=schema-upgrade-cli-tests.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=IgnixaSchemaUpgradeTests;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"

      - name: Upload SqlServer schema test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-deployer-test-results
          path: |
            **/schema-deployer-integration-tests.trx
            **/schema-upgrade-cli-tests.trx
          retention-days: 30

      - name: Restore E2E test project
        run: dotnet restore test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj

      - name: Build E2E test project
        run: dotnet build test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj --configuration Release --no-restore

      - name: Run E2E tests
        run: |
          dotnet test test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=e2e-test-results.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=FhirTest;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"
          # The E2E host creates an empty FhirTest database and relies on SchemaDeployer to populate
          # it on first request. The host runs as environment "Test", where appsettings.json's
          # default of false applies, so without this the first request fails with "database is not
          # initialized". Mirrors the same entry in pr-build.yml.
          SqlServer__AutomaticSchemaDeploymentEnabled: "true"
          IGNIXA_RUN_CONFORMANCE: "true"
          IGNIXA_CONFORMANCE_REPORT_PATH: ${{ runner.temp }}/ignixa-conformance/latest.json
          # Reduce log output in test host
          Logging__LogLevel__Default: "Warning"
          Logging__LogLevel__Microsoft: "Warning"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/e2e-test-results.trx'
          retention-days: 30

      - name: Upload FHIR conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-conformance-report
          path: ${{ runner.temp }}/ignixa-conformance/latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish E2E test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/e2e-test-results.trx'
          check_name: 'E2E Test Results'
          comment_mode: 'off'
          large_files: true

      - name: Capture SQL Server logs on failure
        if: failure()
        run: |
          echo "=== SQL Server Logs ==="
          docker logs ignixa-test-sql
          echo "=== SQL Server Error Logs ==="
          docker exec ignixa-test-sql cat /var/opt/mssql/log/errorlog || true

      - name: Cleanup SQL Server container
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          echo "✅ SQL Server container stopped and removed"

  sql-on-fhir-conformance:
    name: SQL on FHIR Conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Non-gating (like the docs.yml flow it replaces): conformance gaps are recorded in the
    # report, not treated as CI failures. Runs independently of the other jobs so a report
    # regeneration here never blocks Docker publish or notify-*. Consumed by the deploy-docs
    # job below via download-artifact within this same run, instead of docs.yml re-running
    # these suites itself.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate SQL on FHIR conformance report
        env:
          SOF_TEST_REPORT_PATH: ${{ github.workspace }}/docs/site/static/test_report.json
        run: |
          dotnet test test/Ignixa.SqlOnFhir.Tests/Ignixa.SqlOnFhir.Tests.csproj \
            --configuration Release \
            --framework net10.0 \
            --filter "FullyQualifiedName~OfficialSqlOnFhirTestRunner" \
            --verbosity minimal \
            || echo "::warning::Conformance suite reported failures; publishing report with recorded results"

      - name: Verify conformance report was produced
        run: |
          report="${{ github.workspace }}/docs/site/static/test_report.json"
          if [ ! -s "$report" ]; then
            echo "::error::$report was not generated by the conformance suite"
            exit 1
          fi
          if ! jq -e 'length > 0 and (to_entries | any(.value.tests | length > 0))' "$report" > /dev/null; then
            echo "::error::$report does not contain any recorded test outcomes"
            exit 1
          fi
          echo "Generated $report ($(wc -c < "$report") bytes)"

      - name: Generate SQL on FHIR reference implementation report
        # `npm install` (not `npm ci`): third-party vendored submodule we don't control, and its
        # committed package-lock.json isn't guaranteed to stay in sync with package.json at
        # whatever commit the submodule happens to be pinned to — `npm ci` fails hard on that
        # drift instead of reconciling it. A genuine install failure still fails the build via
        # "Verify reference implementation report was produced" below.
        working-directory: test/Ignixa.SqlOnFhir.Tests/sql-on-fhir-tests/sof-js
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          npm install
          npx jest tests/compliance.test.js \
            || echo "::warning::Reference implementation reported conformance failures; publishing report with recorded results"

      - name: Verify reference implementation report was produced
        run: |
          report="test/Ignixa.SqlOnFhir.Tests/sql-on-fhir-tests/test_report/public/test-results.json"
          if [ ! -s "$report" ]; then
            echo "::error::$report was not generated by the reference implementation's compliance suite"
            exit 1
          fi
          if ! jq -e 'length > 0 and (to_entries | any(.value.tests | length > 0))' "$report" > /dev/null; then
            echo "::error::$report exists but contains no recorded test outcomes — the vendored suite likely found zero test files"
            exit 1
          fi
          echo "Generated $report ($(wc -c < "$report") bytes)"

      - name: Upload SQL on FHIR conformance report (pinned)
        # if: success() (not always()) is deliberate: a partial/broken artifact from a failed
        # step here would make docs.yml's download "succeed" and skip its live-generation
        # fallback entirely, turning a CI hiccup into an unrecoverable docs build failure.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sof-conformance-report-pinned
          path: |
            docs/site/static/test_report.json
            test/Ignixa.SqlOnFhir.Tests/sql-on-fhir-tests/test_report/public/test-results.json
          if-no-files-found: warn
          retention-days: 30

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: [ e2e-tests-sql, sql-on-fhir-conformance ]
    # always(): wait for both jobs to finish, but don't gate on their result — a failed
    # conformance job just means no artifact was uploaded, and docs.yml's own download/
    # live-generation fallback already handles that per-report. If the whole run gets
    # cancelled (e.g. cancel-in-progress on a newer push), this job never starts regardless.
    if: always()
    uses: ./.github/workflows/docs.yml
    with:
      from-ci: true
    permissions:
      contents: read
      pages: write
      id-token: write

  check-code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests ]
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore All.sln

      - name: Run static analysis
        run: dotnet build All.sln --configuration Release --no-restore --verbosity minimal /p:TreatWarningsAsErrors=true
        continue-on-error: true

      - name: Check for code style violations
        run: |
          dotnet format All.sln --verify-no-changes --verbosity diagnostic || \
          (echo "⚠️ Code formatting issues detected. Run 'dotnet format' locally." && exit 0)
        continue-on-error: true

  build-and-push-container:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, e2e-tests-sql ]
    if: success() && !inputs.skip_docker
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display version
        run: echo "Building version ${{ steps.gitversion.outputs.semVer }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # NOTE: Version tags (0.0.68, release) are created by publish-release.yml
          # CI only creates branch/sha/latest tags to avoid duplicate version tags
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.gitversion.outputs.semVer }}
            ASSEMBLY_VERSION=${{ steps.gitversion.outputs.assemblySemVer }}
            INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.informationalVersion }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, integration-tests-sql, e2e-tests-sql, build-and-push-container ]
    permissions: {}
    if: |
      always() &&
      needs.build-and-unit-tests.result == 'success' &&
      needs.integration-tests-sql.result == 'success' &&
      needs.e2e-tests-sql.result == 'success' &&
      (needs.build-and-push-container.result == 'success' || needs.build-and-push-container.result == 'skipped')

    steps:
      - name: Create success status
        run: |
          echo "✅ CI pipeline completed successfully"
          echo "Unit tests: ✅"
          echo "Integration tests: ✅"
          echo "E2E tests: ✅"
          echo "Docker build: ${{ needs.build-and-push-container.result == 'skipped' && '⏭️ Skipped' || '✅' }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, integration-tests-sql, e2e-tests-sql, build-and-push-container ]
    permissions: {}
    if: |
      always() &&
      (needs.build-and-unit-tests.result == 'failure' ||
       needs.integration-tests-sql.result == 'failure' ||
       needs.e2e-tests-sql.result == 'failure' ||
       needs.build-and-push-container.result == 'failure')

    steps:
      - name: Create failure status
        run: |
          echo "❌ CI pipeline failed"
          echo "Unit tests: ${{ needs.build-and-unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests-sql.result }}"
          echo "E2E tests: ${{ needs.e2e-tests-sql.result }}"
          echo "Docker build: ${{ needs.build-and-push-container.result }}"
          exit 1
