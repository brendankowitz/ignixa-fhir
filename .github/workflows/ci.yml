name: CI

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '9.0.x' ]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Build and run unit tests (exclude E2E)
        id: build
        uses: ./.github/actions/dotnet-build-and-test
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          solution-file: 'All.sln'
          build-configuration: 'Release'
          test-filter: 'FullyQualifiedName!~E2ETests'

      - name: Store version for later jobs
        run: |
          echo "VERSION=${{ steps.build.outputs.version }}" >> $GITHUB_ENV
          echo "ASSEMBLY_VERSION=${{ steps.build.outputs.assembly-version }}" >> $GITHUB_ENV

  e2e-tests-sql:
    name: E2E Tests (SQL Server)
    runs-on: ubuntu-latest
    # Run in parallel with unit tests for faster CI (both do their own build)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Start SQL Server container
        run: |
          echo "Starting SQL Server and Azurite containers..."
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "❌ Container startup failed. Checking logs..."
            docker compose -f docker-compose.test.yml logs
            docker ps -a
            exit 1
          }
          echo "✅ SQL Server and Azurite started and healthy"
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Verify SQL Server connection
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "SELECT @@VERSION" -b
        timeout-minutes: 2

      - name: Restore dependencies
        run: dotnet restore All.sln

      - name: Build solution
        run: dotnet build All.sln --configuration Release --no-restore

      - name: Run E2E tests
        run: |
          dotnet test All.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~E2ETests" \
            --logger "trx;LogFileName=e2e-test-results.trx" \
            --verbosity normal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=FhirTest;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/e2e-test-results.trx'
          retention-days: 30

      - name: Publish E2E test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/e2e-test-results.trx'
          check_name: 'E2E Test Results'
          comment_mode: 'off'

      - name: Capture SQL Server logs on failure
        if: failure()
        run: |
          echo "=== SQL Server Logs ==="
          docker logs ignixa-test-sql
          echo "=== SQL Server Error Logs ==="
          docker exec ignixa-test-sql cat /var/opt/mssql/log/errorlog || true

      - name: Cleanup SQL Server container
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          echo "✅ SQL Server container stopped and removed"

  check-code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests ]
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore All.sln

      - name: Run static analysis
        run: dotnet build All.sln --configuration Release --no-restore --verbosity minimal /p:TreatWarningsAsErrors=true
        continue-on-error: true

      - name: Check for code style violations
        run: |
          dotnet format All.sln --verify-no-changes --verbosity diagnostic || \
          (echo "⚠️ Code formatting issues detected. Run 'dotnet format' locally." && exit 0)
        continue-on-error: true

  check-docker-changes:
    name: Check for Docker-related changes
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'src/Application/**'
              - 'src/Core/**'
              - 'src/DataLayer/**'
              - 'Dockerfile'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'

  check-nuget-changes:
    name: Check for NuGet-related changes
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.filter.outputs.nuget || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nuget:
              - 'src/Core/Ignixa.Abstractions/**'
              - 'src/Core/Ignixa.FhirFakes/**'
              - 'src/Core/Ignixa.FhirPath/**'
              - 'src/Core/Ignixa.FhirMappingLanguage/**'
              - 'src/Core/Ignixa.PackageManagement/**'
              - 'src/Core/Ignixa.Search/**'
              - 'src/Core/Ignixa.Serialization/**'
              - 'src/Core/Ignixa.Specification/**'
              - 'src/Core/Ignixa.SqlOnFhir/**'
              - 'src/Core/Ignixa.Validation/**'
              - 'src/Core/Extensions/Ignixa.Extensions.FirelySdk5/**'
              - 'src/Core/Extensions/Ignixa.Extensions.FirelySdk6/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'GitVersion.yml'

  build-and-push-container:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, e2e-tests-sql, check-docker-changes ]
    if: success() && needs.check-docker-changes.outputs.should-build == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display version
        run: echo "Building version ${{ steps.gitversion.outputs.semVer }}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ignixa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ignixa.azurecr.io/ignixa-fhir
          tags: |
            type=semver,pattern={{version}},value=${{ steps.gitversion.outputs.semVer }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.gitversion.outputs.semVer }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.gitversion.outputs.semVer }}
            ASSEMBLY_VERSION=${{ steps.gitversion.outputs.assemblySemVer }}
            INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.informationalVersion }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  pack-nuget-packages:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, e2e-tests-sql, check-nuget-changes ]
    if: |
      success() &&
      (needs.check-nuget-changes.outputs.should-publish == 'true' || github.event_name == 'workflow_dispatch')
    outputs:
      version: ${{ steps.gitversion.outputs.nuGetVersion }}
      semver: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Display version
        run: |
          echo "NuGetVersion: ${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore All.sln

      - name: Build solution
        run: dotnet build All.sln --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.nuGetVersion }}

      - name: Pack Core projects
        run: |
          dotnet pack src/Core/Ignixa.Abstractions/Ignixa.Abstractions.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.FhirFakes/Ignixa.FhirFakes.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.FhirPath/Ignixa.FhirPath.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.FhirMappingLanguage/Ignixa.FhirMappingLanguage.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.PackageManagement/Ignixa.PackageManagement.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.Search/Ignixa.Search.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.Serialization/Ignixa.Serialization.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.Specification/Ignixa.Specification.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.SqlOnFhir/Ignixa.SqlOnFhir.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Ignixa.Validation/Ignixa.Validation.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Extensions/Ignixa.Extensions.FirelySdk5/Ignixa.Extensions.FirelySdk5.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}
          dotnet pack src/Core/Extensions/Ignixa.Extensions.FirelySdk6/Ignixa.Extensions.FirelySdk6.csproj --configuration Release --no-build --output ./packages -p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersion }}

      - name: List packages
        run: ls -lh ./packages/

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 30

  publish-to-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [ pack-nuget-packages ]
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ needs.pack-nuget-packages.outputs.version }}
      semver: ${{ needs.pack-nuget-packages.outputs.semver }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create release summary
        run: |
          echo "## 📦 NuGet Packages Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following packages have been published to NuGet.org:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./packages/*.nupkg; do
            basename "$pkg" >> $GITHUB_STEP_SUMMARY
          done

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ publish-to-nuget ]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-to-nuget.outputs.version }}
          SEMVER: ${{ needs.publish-to-nuget.outputs.semver }}
        run: |
          # Check if release already exists
          if gh release view "v$SEMVER" 2>/dev/null; then
            echo "✅ Release v$SEMVER already exists. AI release notes workflow will update it."
          else
            echo "Creating release v$SEMVER..."
            # Create a release with a placeholder note
            # The ai-release-notes workflow will automatically trigger and update it
            gh release create "v$SEMVER" \
              --title "Release v$SEMVER" \
              --notes "📦 NuGet packages published. AI-generating release notes..." \
              --target ${{ github.sha }}
            echo "✅ Release v$SEMVER created successfully"
          fi

      - name: Release created notification
        run: |
          echo "## 🚀 GitHub Release Created" >> $GITHUB_STEP_SUMMARY
          echo "Version: v${{ needs.publish-to-nuget.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
          echo "AI release notes will be generated automatically." >> $GITHUB_STEP_SUMMARY

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, e2e-tests-sql, check-docker-changes, build-and-push-container, pack-nuget-packages, publish-to-nuget, create-github-release ]
    if: |
      always() &&
      needs.build-and-unit-tests.result == 'success' &&
      needs.e2e-tests-sql.result == 'success' &&
      (needs.build-and-push-container.result == 'success' ||
       needs.build-and-push-container.result == 'skipped') &&
      (needs.pack-nuget-packages.result == 'success' ||
       needs.pack-nuget-packages.result == 'skipped') &&
      (needs.publish-to-nuget.result == 'success' ||
       needs.publish-to-nuget.result == 'skipped') &&
      (needs.create-github-release.result == 'success' ||
       needs.create-github-release.result == 'skipped')

    steps:
      - name: Create success status
        run: |
          if [ "${{ needs.build-and-push-container.result }}" = "skipped" ]; then
            echo "✅ CI pipeline completed successfully (Docker build skipped - no relevant changes)"
          else
            echo "✅ CI pipeline completed successfully"
          fi
          echo "Unit tests: ✅"
          echo "E2E tests: ✅"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, e2e-tests-sql, check-docker-changes, build-and-push-container, pack-nuget-packages, publish-to-nuget, create-github-release ]
    if: failure()

    steps:
      - name: Create failure status
        run: |
          echo "❌ CI pipeline failed"
          echo "Unit tests: ${{ needs.build-and-unit-tests.result }}"
          echo "E2E tests: ${{ needs.e2e-tests-sql.result }}"
          echo "Docker build: ${{ needs.build-and-push-container.result }}"
          echo "NuGet packing: ${{ needs.pack-nuget-packages.result }}"
          echo "NuGet publish: ${{ needs.publish-to-nuget.result }}"
          echo "GitHub release: ${{ needs.create-github-release.result }}"
          exit 1
