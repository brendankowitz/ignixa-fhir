name: PR Build

on:
  pull_request:
    branches: [ main, fhir-v2 ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bench/**'
      - 'tools/**'
      - 'docs/site/**'
      - 'All.sln'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/pr-build.yml'
      - '.github/actions/dotnet-build-and-test/**'

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        dotnet-version: [ '10.0.x' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Build and run unit tests (exclude E2E)
        id: build
        uses: ./.github/actions/dotnet-build-and-test
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          solution-file: 'All.sln'
          build-configuration: 'Release'
          # IntegrationTests need a live SQL Server, which this job does not start. They run in
          # integration-tests-sql, which does. Their fixtures fail rather than skip when the connection
          # string is absent, so running them here is 222 red tests that say nothing about the code.
          test-filter: 'FullyQualifiedName!~E2ETests&FullyQualifiedName!~IntegrationTests'

  # Its own job, not a step in e2e-tests-sql. Two reasons: the suite serialises its schema deploys
  # (sixteen concurrent DacFx deploys time each other out) so it runs long, and as a step it made the
  # E2E tests conditional on it -- one integration failure skipped the E2E run entirely.
  integration-tests-sql:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server container
        run: |
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "Container startup failed. Checking logs..."
            docker compose -f docker-compose.test.yml logs
            docker ps -a
            exit 1
          }
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Verify SQL Server connection
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "SELECT @@VERSION" -b
        timeout-minutes: 2

      - name: Run SQL Server integration tests
        run: |
          dotnet test test/Ignixa.DataLayer.SqlServer.IntegrationTests/Ignixa.DataLayer.SqlServer.IntegrationTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=integration-test-results.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=master;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"
          SqlServer__AutomaticSchemaDeploymentEnabled: "true"
          Logging__LogLevel__Default: "Warning"
          Logging__LogLevel__Microsoft: "Warning"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration-test-results.trx'

      - name: Cleanup SQL Server container
        if: always()
        run: docker compose -f docker-compose.test.yml down -v || true

      - name: Create package output directories
        run: |
          mkdir -p ./core-packages
          mkdir -p ./internal-packages

      # ci.yml's pack step only runs on push to main, so a PR touching tools/**,
      # Directory.Build.props, or Directory.Build.targets could break `dotnet pack` (e.g. NU5039
      # missing-readme, or the NU5104 stable-vs-prerelease rule from ADR 2606) without this job
      # ever noticing. --no-build is near-free here since the build above already produced Release
      # binaries. Mirrors ci.yml's "Pack Core projects" step; not uploaded anywhere, just verified.
      - name: Pack Core projects (verify pack succeeds)
        run: |
          find src/Core tools src/Application/Ignixa.Sidecar.Contracts -name "*.csproj" -type f | sort | while read -r PROJECT; do
            echo "Packing: $PROJECT"
            dotnet pack "$PROJECT" --configuration Release --no-build --output ./core-packages \
              -p:BasePackageVersion=${{ steps.build.outputs.nuget-version }} \
              -p:UpdateVersionProperties=false
          done

      # Mirrors ci.yml's "Pack Application projects" step: NU5104 is demoted to a warning here
      # because the internal GitHub Packages feed these publish to is not bound by the public
      # Core feed's stable-package-no-prerelease-dependency rule (ADR 2606).
      - name: Pack Application projects (verify pack succeeds)
        run: |
          find src/Application src/DataLayer -name "*.csproj" -type f -not -path "*Ignixa.Sidecar.Contracts*" | sort | while read -r PROJECT; do
            echo "Packing: $PROJECT"
            dotnet pack "$PROJECT" --configuration Release --no-build --output ./internal-packages \
              -p:BasePackageVersion=${{ steps.build.outputs.nuget-version }} \
              -p:UpdateVersionProperties=false \
              -p:WarningsNotAsErrors=NU5104
          done

  e2e-tests-sql:
    name: E2E Tests (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    # Run in parallel with unit tests for faster CI (both do their own build)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server container
        run: |
          echo "Starting SQL Server and Azurite containers..."
          docker compose -f docker-compose.test.yml up -d --wait || {
            echo "❌ Container startup failed. Checking logs..."
            docker compose -f docker-compose.test.yml logs
            docker ps -a
            exit 1
          }
          echo "✅ SQL Server and Azurite started and healthy"
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Verify SQL Server connection
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "SELECT @@VERSION" -b
        timeout-minutes: 2

      - name: Install SqlPackage
        run: dotnet tool install -g Microsoft.SqlPackage

      - name: Build Ignixa.DataLayer.SqlServer.Database
        run: dotnet build src/DataLayer/Ignixa.DataLayer.SqlServer.Database/Ignixa.DataLayer.SqlServer.Database.sqlproj --configuration Release

      # NOTE: FhirSchemaReview is never created/seeded above, so DacFx will always report
      # "everything gets created" here rather than an incremental diff against a real prior
      # schema. This step is a build-verification signal (proves the dacpac is well-formed and
      # sqlpackage can generate a report against it), not a change-detection signal -- it cannot
      # demonstrate DeployReportClassifier catching anything. A "diff against base branch's
      # deployed schema" version is a deliberate, tracked follow-up, not an oversight.
      # AllowIncompatiblePlatform: the .sqlproj targets Azure SQL Database
      # (SqlAzureV12DatabaseSchemaProvider) because that is the production deployment target, while
      # this container is a box SQL Server 2022. DacFx builds a deployment plan for DeployReport
      # just as it does for a real publish, so without this it refuses on platform mismatch.
      - name: Generate schema DeployReport
        run: |
          sqlpackage /Action:DeployReport \
            /SourceFile:src/DataLayer/Ignixa.DataLayer.SqlServer.Database/bin/Release/Ignixa.DataLayer.SqlServer.Database.dacpac \
            /TargetConnectionString:"Server=localhost,1433;Database=FhirSchemaReview;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false" \
            /OutputPath:${{ runner.temp }}/deployreport.xml \
            /p:AllowIncompatiblePlatform=True
        env:
          SQL_SA_PASSWORD: ${{ env.SQL_SA_PASSWORD }}

      - name: Upload schema DeployReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-deploy-report
          path: ${{ runner.temp }}/deployreport.xml

      # These carry the safety-critical assertions DeployReportClassifier/SchemaDeployer/the
      # schema-upgrade CLI exist for (e.g. a genuinely destructive diff is refused, --allow-data-loss
      # is load-bearing) -- previously [Fact(Skip = ...)]-marked and never run anywhere. They're
      # [SkippableFact] now: each skips itself (not fails) when TEST_SQL_CONNECTION_STRING is unset,
      # so the same test classes remain harmless no-ops in the SQL-Server-less unit-test job while
      # actually running here, against the container already started above.
      - name: Run SqlServer schema deploy/upgrade integration tests
        run: |
          docker exec ignixa-test-sql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -C -U sa -P "${{ env.SQL_SA_PASSWORD }}" \
            -Q "CREATE DATABASE [IgnixaSchemaUpgradeTests]" -b
          dotnet test test/Ignixa.DataLayer.SqlServer.IntegrationTests/Ignixa.DataLayer.SqlServer.IntegrationTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=schema-deployer-integration-tests.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
          dotnet test test/Ignixa.SchemaUpgrade.Cli.Tests/Ignixa.SchemaUpgrade.Cli.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=schema-upgrade-cli-tests.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=IgnixaSchemaUpgradeTests;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"

      - name: Upload SqlServer schema test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-deployer-test-results
          path: |
            **/schema-deployer-integration-tests.trx
            **/schema-upgrade-cli-tests.trx
          retention-days: 30

      - name: Restore E2E test project
        run: dotnet restore test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj

      - name: Build E2E test project
        run: dotnet build test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj --configuration Release --no-restore

      - name: Run E2E tests
        run: |
          dotnet test test/Ignixa.Api.E2ETests/Ignixa.Api.E2ETests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=e2e-test-results.trx;verbosity=minimal" \
            --logger "console;verbosity=minimal" \
            --verbosity minimal
        env:
          TEST_SQL_CONNECTION_STRING: "Server=localhost,1433;Database=FhirTest;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false"
          # The E2E host runs as Production, where AutomaticSchemaDeploymentEnabled defaults to
          # false. FhirTest is a throwaway, empty database in a disposable container -- precisely
          # the brand-new-tenant scenario auto-deploy exists for -- so enable it here. Without
          # this, SchemaDeployer refuses to provision the schema and every E2E test fails at
          # startup with "Tenant 1's database is not initialized".
          SqlServer__AutomaticSchemaDeploymentEnabled: "true"
          IGNIXA_RUN_CONFORMANCE: "true"
          IGNIXA_CONFORMANCE_REPORT_PATH: ${{ runner.temp }}/ignixa-conformance/latest.json
          # The API deploys the dacpac to each tenant database on first use. Without this it refuses
          # to start against an empty database, and every E2E test fails in seconds with "Tenant 1's
          # database is not initialized". Nothing else in this job creates the schema -- the
          # DeployReport step above only diffs, it does not publish.
          SqlServer__AutomaticSchemaDeploymentEnabled: "true"
          # Reduce log output in test host
          Logging__LogLevel__Default: "Warning"
          Logging__LogLevel__Microsoft: "Warning"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: '**/e2e-test-results.trx'
          retention-days: 30

      - name: Upload FHIR conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-conformance-report
          path: ${{ runner.temp }}/ignixa-conformance/latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish E2E test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/e2e-test-results.trx'
          check_name: 'E2E Test Results'
          comment_mode: 'off'
          large_files: true

      - name: Capture SQL Server logs on failure
        if: failure()
        run: |
          echo "=== SQL Server Logs ==="
          docker logs ignixa-test-sql
          echo "=== SQL Server Error Logs ==="
          docker exec ignixa-test-sql cat /var/opt/mssql/log/errorlog || true

      - name: Cleanup SQL Server container
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          echo "✅ SQL Server container stopped and removed"

  validate-docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run in parallel with unit tests for faster CI (Docker does its own build)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for GitVersion
          submodules: recursive

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ignixa-fhir:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          build-args: |
            VERSION=${{ steps.gitversion.outputs.semVer }}
            ASSEMBLY_VERSION=${{ steps.gitversion.outputs.assemblySemVer }}
            INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          docker images ignixa-fhir:pr-${{ github.event.pull_request.number }}
          docker inspect ignixa-fhir:pr-${{ github.event.pull_request.number }}

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build documentation (validates links)
        working-directory: docs/site
        run: npm run build

  pr-success:
    name: PR Validation Complete
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, integration-tests-sql, e2e-tests-sql, validate-docker, validate-docs ]
    permissions:
      contents: read
      pull-requests: write
    if: always() && !contains(needs.*.result, 'failure')

    steps:
      - name: Get version from build job
        id: get_version
        run: echo "This PR validation completed successfully"

      - name: Comment PR on success
        # GITHUB_TOKEN is read-only on fork PRs, so the `pull-requests: write`
        # above is denied and createComment 403s — failing this job and showing
        # a red X on a PR whose builds all passed. Guard the comment, not the
        # job, so the aggregate roll-up still reports on fork PRs.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PR Validation Successful**\n\n- Unit tests passed\n- E2E tests passed (SQL Server)\n- Docker image builds successfully\n- Build uses GitVersion for semantic versioning'
            })

  pr-failure:
    name: PR Validation Failed
    runs-on: ubuntu-latest
    needs: [ build-and-unit-tests, integration-tests-sql, e2e-tests-sql, validate-docker, validate-docs ]
    permissions:
      contents: read
      pull-requests: write
    if: failure()

    steps:
      - name: Comment PR on failure
        # Same fork-PR restriction as pr-success: without this the 403 stacks a
        # second, spurious failure on top of the real build failure.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **PR Validation Failed** - Check the workflow logs for details'
            })
