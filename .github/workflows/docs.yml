name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
      - 'src/**'
      - 'tools/**/*.csproj'
      - 'test/Ignixa.SqlOnFhir.Tests/**'
      - 'Directory.Build.targets'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for GitVersion (GitVersion.MsBuild needs it or the build fails)

      - name: Check out conformance test suite (submodule)
        run: git submodule update --init --depth 1 test/Ignixa.SqlOnFhir.Tests/sql-on-fhir-tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Generate package stability matrix (ADR 2606)
        run: pwsh -NoProfile -File eng/Generate-StabilityMatrix.ps1

      - name: Generate SQL on FHIR conformance report
        # Runs the shared sql-on-fhir.js conformance suite and writes the
        # test_report.json straight into the Docusaurus static dir so it is
        # published at <site>/test_report.json for the implementations grid.
        # Conformance failures are recorded honestly in the report and must not
        # block publishing, so the test exit code is tolerated; the next step
        # fails the build if no report was produced.
        env:
          SOF_TEST_REPORT_PATH: ${{ github.workspace }}/docs/site/static/test_report.json
        run: |
          dotnet test test/Ignixa.SqlOnFhir.Tests/Ignixa.SqlOnFhir.Tests.csproj \
            --configuration Release \
            --framework net10.0 \
            --filter "FullyQualifiedName~OfficialSqlOnFhirTestRunner" \
            --verbosity minimal \
            || echo "::warning::Conformance suite reported failures; publishing report with recorded results"

      - name: Verify conformance report was produced
        run: |
          report="${{ github.workspace }}/docs/site/static/test_report.json"
          if [ ! -s "$report" ]; then
            echo "::error::$report was not generated by the conformance suite"
            exit 1
          fi
          if ! jq -e 'length > 0 and (to_entries | any(.value.tests | length > 0))' "$report" > /dev/null; then
            echo "::error::$report does not contain any recorded test outcomes"
            exit 1
          fi
          echo "Generated $report ($(wc -c < "$report") bytes)"

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build website
        working-directory: docs/site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
