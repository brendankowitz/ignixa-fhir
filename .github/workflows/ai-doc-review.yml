name: AI Documentation Review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs-site/docs/**'
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      generate_mode:
        description: 'Generation mode'
        type: choice
        options:
          - review
          - generate
        default: review

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-doc-review:
    name: AI Documentation Review
    runs-on: ubuntu-latest
    # Only run if Azure OpenAI is configured
    if: ${{ vars.AZURE_OPENAI_ENDPOINT != '' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/**/*.cs
            docs-site/docs/**/*.md

      - name: Check for documentation gaps
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-4o' }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "## Documentation Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if source files changed but no docs updated
          SRC_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^src/" || true)
          DOCS_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^docs-site/" || true)
          
          if [ "$SRC_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
            echo "⚠️ **Warning**: Source files changed but no documentation updated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consider updating:" >> $GITHUB_STEP_SUMMARY
            echo "- API documentation in \`docs-site/docs/core-sdk/\`" >> $GITHUB_STEP_SUMMARY
            echo "- Server documentation in \`docs-site/docs/server/\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Documentation appears to be in sync." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Check for broken links
        working-directory: docs-site
        run: |
          echo "### Link Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if npm run build 2>&1 | grep -i "broken"; then
            echo "❌ Broken links detected. Please fix before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No broken links detected." >> $GITHUB_STEP_SUMMARY
          fi
