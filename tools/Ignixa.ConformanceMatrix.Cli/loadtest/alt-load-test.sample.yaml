# Azure Load Testing configuration template for FHIR TestScript load testing
#
# IMPORTANT: This is a SAMPLE. Copy and customize for your perf-pipeline repo —
# persona-specific values (TESTSCRIPT_MIX, load level, engine count, failure
# criteria) belong there, not here.
#
# Upload model (see the investigation doc):
#   - testPlan            -> locustfile.py, uploaded as the Locust test plan
#   - configurationFiles  -> requirements.txt + locust.conf, uploaded alongside
#   - zipArtifacts        -> the runner + testscripts zip built by
#                            package-alt-artifact.ps1 / .sh; ALT auto-extracts it
#                            next to the locustfile, which is how the locustfile
#                            finds ./runner/ignixa-matrix and ./testscripts
#
# See: docs/features/load-testing/investigations/azure-load-testing-locust.md

version: v0.1

testId: fhir-testscript-persona-example
displayName: "FHIR TestScript Load Test - Example Persona"
description: "Weighted TestScript mix executed by the co-located ignixa-matrix serve runner"

testType: Locust
testPlan: locustfile.py

configurationFiles:
  - requirements.txt
  - locust.conf

zipArtifacts:
  - alt-testscript-artifact.zip   # built by package-alt-artifact.ps1 / .sh (max 50 MB per zip)

# Engine sizing: ALT's generic guidance is ~500 Locust users per engine, but each
# TestScript "user request" fans out into a whole script of FHIR operations —
# expect the sustainable users-per-engine figure to be lower (Phase 3 measures it).
engineInstances: 1

env:
  # Weighted TestScript selection: {"script-id": weight, ...}
  # This example runs PatientSearch 80% and ConditionalCreate 20% of iterations.
  - name: TESTSCRIPT_MIX
    value: '{"PatientSearch": 80, "ConditionalCreate": 20}'

  # FHIR service under test (no trailing slash)
  - name: FHIR_BASE_URL
    value: "https://example.fhir.azurehealthcareapis.com"

  # "performance" | "conformance" — recorded per run; behavior is controlled by
  # the options knobs below.
  - name: RUN_MODE
    value: "performance"

  # Optional: merged into the /run request body as "options".
  # runSetup/runTeardown toggle those phases; assertions is "full" or "none"
  # ("status-only" arrives with Phase 3).
  # - name: TESTSCRIPT_OPTIONS
  #   value: '{"runSetup": true, "runTeardown": false, "assertions": "none"}'

  # Locust load shape (ALT also sets these from the test configuration UI/CLI)
  # - name: LOCUST_USERS
  #   value: "100"
  # - name: LOCUST_SPAWN_RATE
  #   value: "10"
  # - name: LOCUST_RUN_TIME
  #   value: "30m"

# Key Vault-backed secrets: the load test resource's managed identity reads the
# vault and the values surface to the locustfile/runner as environment variables.
# The runner uses these for OAuth2 client-credentials token acquisition.
secrets:
  - name: FHIR_TOKEN_URL
    value: https://my-vault.vault.azure.net/secrets/fhir-token-url/0000000000000000
  - name: FHIR_CLIENT_ID
    value: https://my-vault.vault.azure.net/secrets/fhir-client-id/0000000000000000
  - name: FHIR_CLIENT_SECRET
    value: https://my-vault.vault.azure.net/secrets/fhir-client-secret/0000000000000000
  - name: FHIR_SCOPES
    value: https://my-vault.vault.azure.net/secrets/fhir-scopes/0000000000000000

# Server-side failure criteria evaluated by ALT over the sampler statistics
# (which include the per-FHIR-operation entries the locustfile fires).
failureCriteria:
  - avg(response_time_ms) > 500
  - percentage(error) > 5

# Optional: VNet injection for private FHIR endpoints
# subnetId: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Network/virtualNetworks/<vnet>/subnets/<subnet>

# Optional: multi-region load generation (Azure region names)
# regionalLoadTestConfig:
#   - region: eastus
#     engineInstances: 1
#   - region: westeurope
#     engineInstances: 1
