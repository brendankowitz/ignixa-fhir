# Locust configuration for Azure Load Testing
# Most of these settings are typically overridden by ALT's environment variables:
# LOCUST_USERS, LOCUST_SPAWN_RATE, and LOCUST_RUN_TIME

# These values are used as fallbacks when running locally or if not overridden
# by Azure Load Testing configuration.

# Number of concurrent Locust users
# users = 10

# Rate at which users are spawned (users per second)
# spawn-rate = 2

# How long the test runs (e.g., "5m", "1h30m")
# run-time = 10m

# Headless mode (recommended for CI/load-test runs)
headless = true

# Logging level
loglevel = INFO

# Host is set by the locustfile itself (http://127.0.0.1:RUNNER_PORT)
