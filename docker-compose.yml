# -------------------------------------------------------------------------------------------------
# IGNIXA FHIR SERVER - SQL SERVER DOCKER COMPOSE (SA-PASSWORD, SELF-PROVISIONING)
#
# This stack authenticates to SQL Server with a local "sa" password against a fresh, empty SQL
# Server container, not the Managed Identity + pre-provisioned-database shape of a real production
# deployment (see deploy/azure for that). ASPNETCORE_ENVIRONMENT is pinned to "Development" below,
# which does three things this stack needs:
#   1. Satisfies ManagedIdentityConnectionStringValidator, which defaults to Production when the
#      environment is unset and then rejects any password-bearing connection string -- exactly what
#      this stack's SA_PASSWORD connection string is.
#   2. Makes SchemaDeployer create tenant 1's database itself on first run (that bootstrap is gated
#      on IsDevelopment(); the sqlserver container starts with no databases at all).
#   3. Layers appsettings.Development.json over appsettings.json, which sets
#      SqlServer:AutomaticSchemaDeploymentEnabled to true -- required for SchemaDeployer to publish
#      the schema to that newly-created empty database instead of throwing.
# "Staging" or another non-Production name would satisfy only (1); the compose stack would still
# never get a database. For an actual Managed-Identity production deployment, use deploy/azure.
#
# Configuration:
# This file relies on environment variables from a '.env' file.
# 1. Copy '.env.example' to '.env'
# 2. Set SQL_SA_PASSWORD (Required)
# 3. Set IGNIXA_IMAGE_TAG (Optional, defaults to 'release')
# -------------------------------------------------------------------------------------------------
services:
  ignixa-fhir:
    image: ghcr.io/brendankowitz/ignixa-fhir:${IGNIXA_IMAGE_TAG:-release}
    container_name: ignixa-fhir
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # See the header comment: Development satisfies the Managed Identity guard and is also
      # load-bearing for self-provisioning a fresh database and schema on first run.
      ASPNETCORE_ENVIRONMENT: Development
      # Configure Tenant 1 to use SQL Server
      # Note: Tenant 0 (System) inherits this connection string automatically
      Tenants__Configurations__1__Storage__Type: SqlServer
      Tenants__Configurations__1__Storage__ConnectionString: "Server=sqlserver;Database=IgnixaFhir;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      
      # Configure Logging
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Ignixa: Debug
    networks:
      - ignixa-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU2-GDR1-ubuntu-22.04
    container_name: ignixa-sql
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -C -U sa -P "${SQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - ignixa-net

volumes:
  sqlserver-data:

networks:
  ignixa-net:
    driver: bridge
