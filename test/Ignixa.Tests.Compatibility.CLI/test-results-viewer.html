<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHIR Test Results Viewer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; color: white; margin-bottom: 40px; }
    .header h1 { margin: 0; font-size: 2.5em; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .metric {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border-left: 4px solid #667eea;
    }
    .metric-value { font-size: 2.5em; font-weight: bold; color: #333; }
    .metric-label { color: #666; font-size: 0.9em; margin-top: 5px; text-transform: uppercase; }
    .drop-zone {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      background: #f9f9f9;
    }
    .drop-zone:hover { background: #f0f0f0; }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin: 10px 5px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    .file-input { display: none; }
    .error { color: #d32f2f; padding: 15px; background: #ffebee; border-radius: 8px; margin-bottom: 20px; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .info { color: #333; margin: 10px 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [report, setReport] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        console.log('[App] Component mounted, fetching /api/report...');
        fetch('/api/report')
          .then(r => {
            console.log('[App] Response status:', r.status);
            if (!r.ok) {
              console.log('[App] Not ok, throwing error');
              throw new Error('Not found');
            }
            return r.json();
          })
          .then(data => {
            console.log('[App] Data loaded successfully:', data);
            setReport(data);
          })
          .catch(err => {
            console.log('[App] Fetch error:', err.message);
          })
          .finally(() => {
            setLoading(false);
          });
      }, []);

      const handleFileSelect = (file) => {
        if (!file) return;
        console.log('[App] File selected:', file.name);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            console.log('[App] File parsed successfully');
            setReport(data);
            setError(null);
          } catch (err) {
            setError('Failed to parse JSON: ' + err.message);
          }
        };
        reader.onerror = () => {
          setError('Failed to read file');
        };
        reader.readAsText(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          console.log('[App] File dropped');
          handleFileSelect(files[0]);
        }
      };

      if (loading) {
        return (
          <div className="container">
            <div className="header"><h1>Test Results Viewer</h1></div>
            <div className="card">
              <div className="loading">Loading report...</div>
            </div>
          </div>
        );
      }

      if (report) {
        return (
          <div className="container">
            <div className="header"><h1>Test Results Viewer</h1></div>
            <div className="card">
              <button className="btn" onClick={() => window.location.reload()}>Load Another Report</button>

              <h2>Server: {report.ServerUrl || 'N/A'}</h2>
              <div className="info">Date: {new Date(report.TestRunDate).toLocaleString()}</div>

              <div className="metrics">
                <div className="metric">
                  <div className="metric-value">{report.TotalTests}</div>
                  <div className="metric-label">Total Tests</div>
                </div>
                <div className="metric">
                  <div className="metric-value" style={{color: '#4caf50'}}>{report.Passed}</div>
                  <div className="metric-label">Passed</div>
                </div>
                <div className="metric">
                  <div className="metric-value" style={{color: '#f44336'}}>{report.Failed}</div>
                  <div className="metric-label">Failed</div>
                </div>
                <div className="metric">
                  <div className="metric-value" style={{color: '#ff9800'}}>{report.Skipped}</div>
                  <div className="metric-label">Skipped</div>
                </div>
                <div className="metric">
                  <div className="metric-value">{(report.PassRate * 100).toFixed(1)}%</div>
                  <div className="metric-label">Pass Rate</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="container">
          <div className="header"><h1>Test Results Viewer</h1></div>
          <div className="card">
            {error && <div className="error">{error}</div>}
            <div
              className="drop-zone"
              onDrop={handleDrop}
              onDragOver={(e) => e.preventDefault()}
              onClick={() => fileInputRef.current?.click()}
            >
              <h2>Drop Test Report Here</h2>
              <p>or click to browse</p>
              <p style={{color: '#999', fontSize: '0.9em'}}>Waiting for report...</p>
            </div>
            <input
              ref={fileInputRef}
              type="file"
              className="file-input"
              accept=".json"
              onChange={(e) => handleFileSelect(e.target.files?.[0])}
            />
            <div style={{ textAlign: 'center', marginTop: '20px' }}>
              <button className="btn" onClick={() => fileInputRef.current?.click()}>
                Select File
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
